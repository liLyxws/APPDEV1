<button id="changeColorBtn">Change Background</button>
<p id="message">This paragraph will update in 2 seconds.</p>

<script>
  const button = document.getElementById("changeColorBtn");
  button.addEventListener("click", () => {
    const color = prompt("Anong color gusto mong background?");
    document.body.style.backgroundColor = color;
  });

  const message = document.getElementById("message");
  setTimeout(() => {
    message.textContent = "Na-update na ako after 2 seconds!";
  }, 2000);
</script>
